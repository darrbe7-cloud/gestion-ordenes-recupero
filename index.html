<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión Órdenes Recupero</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="view-login" class="login-wrap">
    <div class="login-card">
      <h1>Gestión Órdenes Recupero</h1>
      <div class="field">
        <label>Usuario</label>
        <input type="text" id="loginUsername" autocomplete="username">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
      </div>
      <button class="btn-primary btn-block" id="btnLogin" onclick="doLogin()">Ingresar</button>
      <div id="loginError" class="error-text hidden"></div>
    </div>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="view-app" class="hidden">
    <div class="topbar">
      <div class="title">Gestión Órdenes Recupero</div>
      <div class="user-info">
        <span id="topbarUser"></span>
        <button class="btn-secondary" onclick="openChangePassword()">Cambiar clave</button>
        <button class="btn-secondary" onclick="doLogout()">Salir</button>
      </div>
    </div>

    <div class="container">

      <div id="adminTabs" class="tabs hidden">
        <button class="tab-btn active" data-tab="tab-upload" onclick="switchTab('tab-upload')">Cargar archivo</button>
        <button class="tab-btn" data-tab="tab-users" onclick="switchTab('tab-users')">Usuarios</button>
        <button class="tab-btn" data-tab="tab-data" onclick="switchTab('tab-data')">Ver datos</button>
      </div>

      <!-- TAB: CARGAR ARCHIVO -->
      <div id="tab-upload" class="tab-content">
        <div class="card">
          <h2>Subir y procesar archivo</h2>
          <p class="muted">Selecciona el .xlsx más reciente. Al procesarlo, la base anterior se reemplaza por completo.</p>
          <input type="file" id="fileInput" accept=".xlsx">
          <button class="btn-primary" style="margin-top:10px;" onclick="uploadFile()">Subir y procesar</button>
        </div>
        <div id="processProgress"></div>
        <div class="card">
          <h2>Estado actual de la base</h2>
          <div id="metaStats" class="stat-row"></div>
        </div>
      </div>

      <!-- TAB: USUARIOS -->
      <div id="tab-users" class="tab-content hidden">
        <div class="card">
          <div class="toolbar" style="justify-content: space-between;">
            <h2 style="margin:0;">Usuarios</h2>
            <div style="display:flex; gap:8px;">
              <button class="btn-secondary" onclick="downloadUsersBackup()">Descargar respaldo</button>
              <button class="btn-secondary" onclick="document.getElementById('restoreFileInput').click()">Restaurar respaldo</button>
              <input type="file" id="restoreFileInput" accept=".json" class="hidden" onchange="restoreUsersBackup(this.files[0])">
              <button class="btn-primary" onclick="openUserModal()">+ Nuevo usuario</button>
            </div>
          </div>
          <table>
            <thead><tr><th>Usuario</th><th>Rol</th><th>Comunas</th><th>Tipos</th><th>Estado</th><th></th></tr></thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB: VER DATOS (admin) -->
      <div id="tab-data" class="tab-content hidden">
        <div class="card" id="dataCardAdmin"></div>
      </div>

      <!-- USER DASHBOARD -->
      <div id="userDashboard" class="hidden">
        <div class="card" id="dataCardUser"></div>
      </div>

    </div>
  </div>

  <!-- ===================== MODAL: NUEVO/EDITAR USUARIO ===================== -->
  <div id="userModalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="userModalTitle">Nuevo usuario</h3>
      <input type="hidden" id="userModalId">
      <div class="form-row">
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="userModalUsername">
        </div>
        <div class="field">
          <label>Rol</label>
          <select id="userModalRol">
            <option value="USER">Usuario</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label id="userModalPasswordLabel">Contraseña</label>
        <input type="password" id="userModalPassword">
      </div>
      <div class="field">
        <label>Comunas que puede ver (vacío = todas)</label>
        <input type="text" class="search-mini" placeholder="Buscar comuna..." oninput="filterCheckboxList('comunasCheckboxList', this.value)">
        <div class="checkbox-list" id="comunasCheckboxList"></div>
      </div>
      <div class="field">
        <label>Tipos de equipo que puede ver (vacío = todos)</label>
        <input type="text" class="search-mini" placeholder="Buscar tipo..." oninput="filterCheckboxList('tiposCheckboxList', this.value)">
        <div class="checkbox-list" id="tiposCheckboxList"></div>
      </div>
      <div class="field">
        <label><input type="checkbox" id="userModalActivo" style="width:auto;" checked> Usuario activo</label>
      </div>
      <div id="userModalError" class="error-text hidden"></div>
      <div style="display:flex; gap:10px; margin-top: 16px;">
        <button class="btn-primary" onclick="saveUserModal()">Guardar</button>
        <button class="btn-secondary" onclick="closeUserModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- ===================== MODAL: CAMBIAR CLAVE ===================== -->
  <div id="passModalOverlay" class="modal-overlay hidden">
    <div class="modal-box" style="width:340px;">
      <h3>Cambiar mi contraseña</h3>
      <div class="field">
        <label>Nueva contraseña</label>
        <input type="password" id="newPasswordInput">
      </div>
      <div id="passModalMsg" class="error-text hidden"></div>
      <div style="display:flex; gap:10px; margin-top: 16px;">
        <button class="btn-primary" onclick="submitChangePassword()">Guardar</button>
        <button class="btn-secondary" onclick="closeChangePassword()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
